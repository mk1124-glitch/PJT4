<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPIc 녹음 교정용 자동 전사</title><style>*{box-sizing:border-box}body{font:15px/1.6 system-ui,'Malgun Gothic',sans-serif;background:#eef3fa;color:#142b45;margin:0}header{background:white;padding:18px;border-bottom:1px solid #d7e2ee}header div,main{max-width:850px;margin:auto}main{padding:24px 14px}section{background:#fff;border:1px solid #d7e2ed;padding:23px;border-radius:15px;margin:0 0 15px}h1{margin:0;font-size:26px}h2{font-size:20px;margin:0 0 12px}p{color:#52677d}label{display:block;font-weight:700;margin:13px 0 4px}input{padding:10px;border:1px solid #bacada;border-radius:8px;width:100%}button{background:#1774bc;color:#fff;border:0;padding:12px 16px;font:inherit;font-weight:700;border-radius:9px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}.note{background:#f3f7fd;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:580px;overflow-y:auto;background:#f5f7fb;padding:16px;border-radius:8px}progress{width:100%;height:13px}a{color:#176cb0}</style></head><body><header><div><b>🎙️ OPIc Listening Lab</b> · 녹음 전사 도우미</div></header><main><section><h1>녹음을 문항별 영어로 전사</h1><p>모의고사 음성파일과 질문기록을 선택하면 이 컴퓨터에서 Whisper 모델로 영어를 전사해. 결과를 복사해 ChatGPT에 붙여넣으면 실제 발화에 근거해 표현을 교정할 수 있어.</p><p class="note">최초 한 번 인터넷에서 모델을 내려받아야 해. 녹음은 외부 서버에 업로드되지 않아. Edge/Chrome과 WebGPU를 권장해. 음성 인식은 오류가 있을 수 있어.</p><label>① 녹음 파일 (.m4a/.webm)</label><input id="audio" type="file" accept="audio/*,.m4a,.webm"><label>② 질문 기록 (.txt)</label><input id="log" type="file" accept=".txt,text/plain"><button id="go">영어 전사 시작</button> <a href="index.html">모의고사로 돌아가기 ↗</a><p><progress id="prog" max="100" value="0"></progress></p><p id="status" class="note">두 파일을 선택해 줘.</p></section><section><h2>전사 결과</h2><button id="copy">전체 복사</button><button id="save">TXT 저장</button><pre id="out">아직 전사 결과가 없어.</pre></section></main>
<script type="module">
const $=id=>document.getElementById(id);let output='';const st=x=>$('status').textContent=x;
const logParse=t=>[...t.matchAll(/Q(\d+) \[([^\]]+)\] \((\d+):(\d+), listens: \d+\)\s*\n([^\n]+)/g)].map(m=>({n:+m[1],type:m[2],d:+m[3]*60+(+m[4]),q:m[5].trim()}));
$('go').onclick=async()=>{const af=$('audio').files[0],lf=$('log').files[0];if(!af||!lf){st('녹음과 문제 기록 파일을 모두 선택해 줘.');return} $('go').disabled=true;output='';let context;try{
const qs=logParse(await lf.text());if(!qs.length)throw Error('질문 기록 형식을 읽을 수 없어. Listening Lab에서 내려받은 질문 TXT를 선택해 줘.');
st('음성 인식 모델을 불러오고 있어. 첫 실행은 다운로드가 필요해.');const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');env.allowLocalModels=false;
let asr;try{asr=await pipeline('automatic-speech-recognition','onnx-community/whisper-base.en',{device:navigator.gpu?'webgpu':'wasm',progress_callback:x=>{if(x.status==='progress'&&x.progress!==undefined)st('모델 다운로드: '+Math.round(x.progress)+'%')}})}catch(e){st('기본 모델 오류, 작은 모델로 재시도: '+e.message);asr=await pipeline('automatic-speech-recognition','onnx-community/whisper-tiny.en',{device:navigator.gpu?'webgpu':'wasm'})}
st('녹음을 해독하고 16kHz로 변환하는 중...');context=new AudioContext();const source=await context.decodeAudioData(await af.arrayBuffer());const offline=new OfflineAudioContext(1,Math.ceil(source.duration*16000),16000);const node=offline.createBufferSource();node.buffer=source;node.connect(offline.destination);node.start();const decoded=await offline.startRendering();const samples=decoded.getChannelData(0);await context.close();context=null;let total=qs.reduce((a,x)=>a+x.d,0),scale=samples.length/(total*16000),pos=0;
output='OPIc 실제 발화 자동 전사 (AI 추정, 검토 필요)\n\n';
for(let i=0;i<qs.length;i++){let q=qs[i];let a=Math.round(pos*scale*16000),b=Math.min(samples.length,Math.round((pos+q.d)*scale*16000));pos+=q.d;let txt='';if(q.n===9&&q.d<20){txt='[실수로 스킵한 문항]'}else{st('Q'+q.n+'/'+qs.length+' 전사 중...');try{const r=await asr(samples.slice(a,b),{chunk_length_s:25,stride_length_s:4});txt=r.text?.trim()||'[발화 인식 실패]'}catch(e){txt='[오류: '+e.message+']'}}
output+='Q'+q.n+' · '+q.type+'\nQUESTION: '+q.q+'\nANSWER (automatic): '+txt+'\n\n';$('out').textContent=output;$('prog').value=(i+1)*100/qs.length;await new Promise(r=>setTimeout(r,30))}
st('완료! 결과를 복사해 ChatGPT에 보내 줘. 질문·답변을 대조해 구체적으로 교정할게.');
}catch(e){st('오류: '+e.message+'\n사내망의 Hugging Face 접속 차단 또는 브라우저 WebGPU 문제일 수 있어.');}finally{if(context)await context.close().catch(()=>{});$('go').disabled=false}}
$('copy').onclick=async()=>{if(!output)return;try{await navigator.clipboard.writeText(output);st('복사 완료! ChatGPT에 붙여넣어 줘.')}catch(e){st('복사 실패: 결과 창에서 직접 복사해 줘.')}};
$('save').onclick=()=>{if(!output)return;let b=new Blob([output],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='OPIc_speech_transcript.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
